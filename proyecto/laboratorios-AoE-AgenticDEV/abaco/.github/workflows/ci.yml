name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  LIMITE_LINEAS: 400

jobs:
  tamano-pr:
    name: gate de tamano de PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: contar lineas del diff
        run: |
          LINEAS=$(git diff --numstat origin/${{ github.base_ref }}...HEAD \
            | awk '{s+=$1+$2} END {print s+0}')
          echo "diff de $LINEAS lineas (limite $LIMITE_LINEAS)"
          if [ "$LINEAS" -gt "$LIMITE_LINEAS" ]; then
            echo "::error::PR de $LINEAS lineas. El limite es $LIMITE_LINEAS."
            echo "Un PR que no se puede revisar no se puede aprobar. Partelo."
            exit 1
          fi

  privacidad:
    name: datos personales fuera del repositorio de aprendizaje
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: escanear archivos de texto del repositorio
        run: python3 herramientas/escanear_pii.py
      - name: escanear mensajes introducidos por el PR
        if: github.event_name == 'pull_request'
        run: |
          git log --format=%B origin/${{ github.base_ref }}...HEAD > .mensajes-pr.txt
          python3 herramientas/escanear_pii.py

  tests:
    name: suite y cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - name: pytest
        run: python3 -m pytest tests/ -q --cov=src/abaco --cov-report=term-missing
      - name: cobertura minima del dominio
        run: python3 -m pytest tests/ -q --cov=src/abaco --cov-fail-under=60

  trazabilidad:
    name: trazabilidad spec a test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - name: todo criterio de aceptacion tiene test
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, '.')
          from agentes.mcp_abaco.servidor import listar_specs, trazabilidad
          fallo = False
          for s in listar_specs()["specs"]:
              if s["estado"] != "activa":
                  continue
              t = trazabilidad({"spec_id": s["id"]})
              print("%s: %.1f%% de cobertura de criterios" % (s["id"], t["cobertura_pct"]))
              if t["sin_cubrir"]:
                  print("::error::%s sin cubrir: %s" % (s["id"], ", ".join(t["sin_cubrir"])))
                  fallo = True
          sys.exit(1 if fallo else 0)
          PY

  agente:
    name: agente de staffing: seguridad y utilidad
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - name: evaluar el agente contra el conjunto dorado
        run: python3 -m agentes.staffing.evaluar

  imagen:
    name: build imagen OCI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: podman build
        run: |
          if command -v podman >/dev/null; then podman build -t abaco:ci .; \
          else docker build -t abaco:ci .; fi

  despliegue:
    name: deploy a entorno de laboratorio
    needs: [tests, trazabilidad, imagen]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: desplegar
        run: echo "despliegue del servicio, ver labs/S7-despliegue/reversion.md"
