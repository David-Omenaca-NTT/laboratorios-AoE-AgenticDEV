name: gate de manifiesto de agente

on:
  pull_request:
    paths:
      - 'agentes/**'
      - 'manifiestos/**'
      - 'src/**'
      - 'politicas/**'
      - 'evals/**'
      - 'herramientas/**'
      - '.github/workflows/**'
      - 'requirements*.txt'

jobs:
  manifiesto:
    name: manifiesto estructurado, alineado, vigente y dentro de N2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - name: validar manifiestos y huellas completas
        run: python3 herramientas/validar_manifiestos.py
