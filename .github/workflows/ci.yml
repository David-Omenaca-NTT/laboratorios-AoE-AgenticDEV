name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  LIMITE_LINEAS: 400

jobs:
  tamano-pr:
    name: gate de tamano de PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: contar lineas del diff
        run: |
          LINEAS=$(git diff --numstat origin/${{ github.base_ref }}...HEAD \
            | awk '{s+=$1+$2} END {print s+0}')
          echo "diff de $LINEAS lineas (limite $LIMITE_LINEAS)"
          if [ "$LINEAS" -gt "$LIMITE_LINEAS" ]; then
            echo "::error::PR de $LINEAS lineas. El limite es $LIMITE_LINEAS."
            echo "Un PR que no se puede revisar no se puede aprobar. Partelo."
            exit 1
          fi

  s0:
    name: comprobaciones de S0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - name: pytest S0
        run: python3 -m pytest tests/test_s0_bootstrap.py -q
